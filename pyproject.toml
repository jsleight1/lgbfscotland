[project]
name = "lgbfscotland"
version = "1.0.0"
description = "Python shiny application for presenting Scottish local government benchmarking framework data"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Jack Sleight", email = "jacksleight@hotmail.co.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-storage-blob>=12.28.0",
    "brand-yml>=0.1.1",
    "dynaconf[toml]>=3.2.13",
    "faicons>=0.2.2",
    "libsass>=0.23.0",
    "loguru>=0.7.3",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "plotly-express>=0.4.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-snapshot>=0.9.0",
    "requests>=2.32.5",
    "ruff>=0.15.6",
    "shiny>=1.5.1",
    "shinywidgets>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/jsleight1/lgbfscotland/"
Changelog = "https://github.com/jsleight1/lgbfscotland/blob/main/CHANGELOG.md"