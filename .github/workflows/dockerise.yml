on:
  push:
    branches: [main]

name: Dockerise

permissions: read-all

jobs:
  dockerise:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PYVERSION: 3.14
    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Get Python package version
      run: |
        version=$(grep version pyproject.toml | grep -o "[0-9.]\+")
        echo "packageVersion=${version}" >> $GITHUB_ENV
      shell: bash {0}
    - name: Get current date
      run: |
        echo "DATE=`date +%Y%m%d`" >> $GITHUB_ENV
      shell: bash {0}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/arm64, linux/amd64
        push: true
        build-args: |
          PYVERSION=${{ env.PYVERSION }}
        tags: |
          ${{ vars.DOCKERHUB_USERNAME }}/lgbfscotland:latest
          ${{ vars.DOCKERHUB_USERNAME }}/lgbfscotland:development
          ${{ vars.DOCKERHUB_USERNAME }}/lgbfscotland:P${{ env.PYVERSION }}-v${{ env.packageVersion }}-latest
          ${{ vars.DOCKERHUB_USERNAME }}/lgbfscotland:P${{ env.PYVERSION }}-v${{ env.packageVersion }}-${{ env.DATE }}