on:
  push:
    branches: [main]
  pull_request:

name: Test package

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: docker.io/jsleight1/lgbfscotland:development
    steps:
      - uses: actions/checkout@v6
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest