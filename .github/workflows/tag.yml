on:
  push:
    branches: [development]

name: Tag

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Tag
        run: |
          VERSION=$(uv version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          git tag "v$VERSION"
          git push origin "v$VERSION"