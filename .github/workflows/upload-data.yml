# on:
#   schedule:
#     # Upload data to Azure blob every 6 months
#     - cron: "0 0 1 */6 *"

on:
  pull_request:

name: Upload data

permissions: read-all

jobs:
  upload-data:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os}} ${{matrix.config.python}}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, python: '3.14'}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.config.python }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Upload data to Azure blob
        env:
          ENV_FOR_DYNACONF: production
          DYNACONF_AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          DYNACONF_BLOB_ACCOUNT_URL: ${{ secrets.BLOB_ACCOUNT_URL }}
          DYNACONF_BLOB_ACCOUNT_KEY ${{ secrets.BLOB_ACCOUNT_KEY }}
        run: |
          from lgbfscotland.utils_data_processing import save_lgbf_data
          from lgbfscotland.utils_config import settings
          print(settings.type)
          save_lgbf_data()
        shell: uv run python {0}
